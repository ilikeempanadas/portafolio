<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculadora IMC</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg, #fc8ee4, #ffe46c);
      padding:20px;
    }

    .contenedor{
      background:white;
      width:100%;
      max-width:420px;
      padding:30px;
      border-radius:25px;
      box-shadow:0 10px 25px rgba(253, 46, 143, 0.2);
      animation: aparecer 0.5s ease;
    }

    @keyframes aparecer{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    h1{
      text-align:center;
      color:#ff4180;
      margin-bottom:20px;
      font-size:2rem;
      border-style: dotted;
      border-radius: 16px;
      border-width: 5px;
      border-color: rgb(255, 149, 175);
    }

    .subtitulo{
      text-align:center;
      color:#6e491f;
      margin-bottom:20px;
      font-size:14px;
    }

    .grupo{
      margin-bottom:15px;
    }

    label{
      display:block;
      margin-bottom:6px;
      font-weight:bold;
      color:#ff4180;
    }

    input, select{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:2px solid #d8c2f0;
      outline:none;
      font-size:16px;
      transition:0.3s;
    }

    input:focus,
    select:focus{
      border-color:#ff4180;
      box-shadow:0 0 10px rgba(123,44,191,0.2);
    }

    .botones{
      display:flex;
      gap:10px;
      margin-top:20px;
    }

    button{
      flex:1;
      padding:12px;
      border:none;
      border-radius:12px;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
      font-weight:bold;
    }

    .btn-calcular{
      background:#ffdc7c8f;
      color:rgb(173, 123, 66);
      border-style: solid;
      border-radius: 15px;
      border-color: rgb(255, 57, 116);
    }

    .btn-calcular:hover{
      background:#ff88b04f;
      transform:scale(1.03);
    }

    .btn-limpiar{
       background:#ffdc7c8f;
      color:rgb(173, 123, 66);
      border-style: solid;
      border-radius: 15px;
      border-color: rgb(255, 57, 116);
    }

    .btn-limpiar:hover{
      background:#ff88b04f;
      transform:scale(1.03);
    }

    .resultado{
      margin-top:25px;
      padding:18px;
      border-radius:15px;
      text-align:center;
      display:none;
      animation:fadeIn 0.4s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:scale(0.95);
      }
      to{
        opacity:1;
        transform:scale(1);
      }
    }

    .resultado h2{
      margin-bottom:10px;
    }

    .normal{
      background:#d8f3dc;
      color:#1b4332;
    }

    .bajo{
      background:#dbeafe;
      color:#1e3a8a;
    }

    .sobrepeso{
      background:#fff3cd;
      color:#9a6700;
    }

    .obesidad{
      background:#ffe5e5;
      color:#b00020;
    }

    .error{
      background:#ffe5e5;
      color:#b00020;
    }

    .tabla-imc{
      margin-top:20px;
      font-size:14px;
      color:#555;
      border-top:1px solid #fff2aa;
      padding-top:15px;
    }

    .tabla-imc ul{
      margin-top:10px;
      padding-left:18px;
    }

    .historial{
      margin-top:20px;
      border-top:1px solid #ddd;
      padding-top:15px;
    }

    .historial h3{
      margin-bottom:10px;
      color:#5a189a;
    }

    .historial ul{
      list-style:none;
      max-height:150px;
      overflow-y:auto;
    }

    .historial li{
      background:#f7f2fc;
      margin-bottom:8px;
      padding:10px;
      border-radius:10px;
      font-size:14px;
    }

    @media(max-width:480px){

      .contenedor{
        padding:20px;
      }

      h1{
        font-size:1.7rem;
      }

      .botones{
        flex-direction:column;
      }
    }
  </style>
</head>

<body>

  <main class="contenedor" aria-labelledby="titulo-app">

    <h1 id="titulo-app">Calculadora IMC 🧍</h1>

    <p class="subtitulo">
      Calcula tu índice de masa corporal fácilmente.
    </p>

    <div class="grupo">
      <label for="unidad">Sistema de unidades</label>

      <select id="unidad" aria-label="Seleccionar sistema de unidades">
        <option value="metric">Métrico (kg / m)</option>
        <option value="imperial">Imperial (lbs / pulgadas)</option>
      </select>
    </div>

    <div class="grupo">
      <label for="peso" id="labelPeso">Peso (kg)</label>

      <input
        type="number"
        id="peso"
        step="0.1"
        placeholder="Ej: 70"
        aria-label="Ingresar peso"
      >
    </div>

    <div class="grupo">
      <label for="altura" id="labelAltura">Altura (m)</label>

      <input
        type="number"
        id="altura"
        step="0.01"
        placeholder="Ej: 1.75"
        aria-label="Ingresar altura"
      >
    </div>

    <div class="botones">
      <button class="btn-calcular" id="btnCalcular">
        Calcular
      </button>

      <button class="btn-limpiar" id="btnLimpiar">
        Limpiar
      </button>
    </div>

    <section
      id="resultado"
      class="resultado"
      aria-live="polite"
    >
    </section>

    <section class="tabla-imc">
      <strong>Guía rápida IMC:</strong>

      <ul>
        <li>Bajo peso: menos de 18.5</li>
        <li>Normal: 18.5 - 24.9</li>
        <li>Sobrepeso: 25 - 29.9</li>
        <li>Obesidad: 30 o más</li>
      </ul>
    </section>

    <section class="historial">
      <h3>Historial 📋</h3>

      <ul id="listaHistorial">
      </ul>
    </section>

  </main>

  <script>

    // =========================
    // ELEMENTOS DEL DOM
    // =========================

    const pesoInput = document.getElementById("peso");
    const alturaInput = document.getElementById("altura");
    const resultado = document.getElementById("resultado");
    const btnCalcular = document.getElementById("btnCalcular");
    const btnLimpiar = document.getElementById("btnLimpiar");
    const unidadSelect = document.getElementById("unidad");
    const listaHistorial = document.getElementById("listaHistorial");
    const labelPeso = document.getElementById("labelPeso");
    const labelAltura = document.getElementById("labelAltura");


    // =========================
    // EVENTOS
    // =========================

    btnCalcular.addEventListener("click", calcularIMC);

    btnLimpiar.addEventListener("click", limpiarCampos);

    // Calcular con Enter
    document.addEventListener("keydown", function(e){
      if(e.key === "Enter"){
        calcularIMC();
      }
    });

    // Cambio de unidades
    unidadSelect.addEventListener("change", actualizarUnidades);


    // =========================
    // FUNCIONES
    // =========================

    function actualizarUnidades(){

      if(unidadSelect.value === "metric"){
        labelPeso.textContent = "Peso (kg)";
        labelAltura.textContent = "Altura (m)";
        pesoInput.placeholder = "Ej: 70";
        alturaInput.placeholder = "Ej: 1.75";
      }
      else{
        labelPeso.textContent = "Peso (lbs)";
        labelAltura.textContent = "Altura (pulgadas)";
        pesoInput.placeholder = "Ej: 154";
        alturaInput.placeholder = "Ej: 69";
      }
    }


    function calcularIMC(){

      resultado.style.display = "block";
      resultado.className = "resultado";

      let peso = parseFloat(pesoInput.value);
      let altura = parseFloat(alturaInput.value);

      // Validación básica
      if(isNaN(peso) || isNaN(altura)){

        mostrarError("⚠️ Completa todos los campos.");
        return;
      }

      // Validaciones realistas
      if(unidadSelect.value === "metric"){

        if(peso < 30 || peso > 500){
          mostrarError("⚠️ El peso debe estar entre 30 y 500 kg.");
          return;
        }

        if(altura < 0.5 || altura > 3){
          mostrarError("⚠️ La altura debe estar entre 0.5 y 3 metros.");
          return;
        }
      }
      else{

        if(peso < 66 || peso > 1100){
          mostrarError("⚠️ El peso debe estar entre 66 y 1100 lbs.");
          return;
        }

        if(altura < 20 || altura > 120){
          mostrarError("⚠️ La altura debe estar entre 20 y 120 pulgadas.");
          return;
        }

        // Conversión imperial -> métrico
        peso = peso * 0.453592;
        altura = altura * 0.0254;
      }

      // Simulación ligera de carga
      resultado.innerHTML = "Calculando... ⏳";

      setTimeout(() => {

        const imc = peso / (altura * altura);

        mostrarResultado(imc);

      }, 500);
    }


    function mostrarResultado(imc){

      let clasificacion = "";
      let emoji = "";
      let clase = "";

      if(imc < 18.5){
        clasificacion = "Bajo peso";
        emoji = "🥲";
        clase = "bajo";
      }
      else if(imc < 25){
        clasificacion = "Peso normal";
        emoji = "😎";
        clase = "normal";
      }
      else if(imc < 30){
        clasificacion = "Sobrepeso";
        emoji = "🍔";
        clase = "sobrepeso";
      }
      else{
        clasificacion = "Obesidad";
        emoji = "⚠️";
        clase = "obesidad";
      }

      resultado.classList.add(clase);

      resultado.innerHTML = `
        <h2>Tu IMC es: ${imc.toFixed(2)}</h2>
        <p><strong>${clasificacion}</strong> ${emoji}</p>
        <small>Resultado calculado correctamente ✅</small>
      `;

      guardarHistorial(imc, clasificacion);
    }


    function mostrarError(mensaje){

      resultado.style.display = "block";
      resultado.classList.add("error");

      resultado.innerHTML = `
        <h2>Error</h2>
        <p>${mensaje}</p>
      `;
    }


    function limpiarCampos(){

      pesoInput.value = "";
      alturaInput.value = "";

      resultado.style.display = "none";
      resultado.innerHTML = "";
      resultado.className = "resultado";

      pesoInput.focus();
    }


    // =========================
    // HISTORIAL
    // =========================

    function guardarHistorial(imc, clasificacion){

      const historial = JSON.parse(
        sessionStorage.getItem("historialIMC")
      ) || [];

      historial.unshift({
        imc: imc.toFixed(2),
        clasificacion: clasificacion,
        fecha: new Date().toLocaleTimeString()
      });

      // Máximo 5 registros
      if(historial.length > 5){
        historial.pop();
      }

      sessionStorage.setItem(
        "historialIMC",
        JSON.stringify(historial)
      );

      cargarHistorial();
    }


    function cargarHistorial(){

      const historial = JSON.parse(
        sessionStorage.getItem("historialIMC")
      ) || [];

      listaHistorial.innerHTML = "";

      historial.forEach(item => {

        const li = document.createElement("li");

        li.innerHTML = `
          IMC: <strong>${item.imc}</strong> -
          ${item.clasificacion}
          <br>
          <small>${item.fecha}</small>
        `;

        listaHistorial.appendChild(li);
      });
    }


    // Cargar historial al iniciar
    cargarHistorial();

  </script>

</body>
</html>
