<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora IMC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:
radial-gradient(#ffffff80 2px, transparent 2px),
linear-gradient(135deg,#FF8FAB,#FFC2D1,#FFF1D6,#B08968);
background-size:25px 25px,100% 100%;
}
.contenedor{
max-width:550px;width:100%;
background:#FFF8F0;
padding:30px;border-radius:35px;
border:6px dotted #FF8FAB;
box-shadow:0 0 0 10px #FFF1D6,0 0 0 15px #FFC2D1,0 15px 35px rgba(0,0,0,.15);
}
h1{text-align:center;color:#ff5d8f;margin-bottom:10px}
.gato{text-align:center;font-size:70px;margin:10px 0}
.sub{text-align:center;color:#8b6b54;margin-bottom:20px}
label{display:block;margin:10px 0 5px;color:#ff5d8f;font-weight:bold}
input{
width:100%;padding:12px;border-radius:15px;border:2px solid #FFC2D1;
}
button{
width:100%;padding:12px;margin-top:15px;border:none;
border-radius:18px;background:#FF8FAB;color:white;
font-weight:bold;cursor:pointer;
}
button:hover{transform:scale(1.03)}
.resultado,.tips{
display:none;margin-top:20px;padding:15px;border-radius:20px
}
.resultado{background:#FFF1D6}
.tips{background:#ffe7ef}
.barra{
height:22px;background:#eee;border-radius:30px;overflow:hidden;margin-top:15px
}
.progreso{
height:100%;width:0%;
background:linear-gradient(90deg,#FF8FAB,#B08968);
transition:1s;
}
ul{padding-left:20px;margin-top:10px}
</style>
</head>
<body>
<div class="contenedor">
<h1>🎀 Calculadora IMC 🎀</h1>
<p class="sub"><img src="/imagenes/pudding.gif" alt=""></p>

<label>Peso (kg)</label>
<input type="number" id="peso" placeholder="Ej: 70">

<label>Altura (m)</label>
<input type="number" id="altura" placeholder="Ej: 1.70">

<button onclick="calcularIMC()">💖 Calcular IMC</button>

<div class="resultado" id="resultado"></div>

<div class="barra">
<div class="progreso" id="progreso"></div>
</div>

<div class="tips" id="tips"></div>
</div>

<script>
function calcularIMC(){
let peso=parseFloat(document.getElementById("peso").value);
let altura=parseFloat(document.getElementById("altura").value);

if(!peso || !altura){
alert("Completa todos los campos");
return;
}

let imc=peso/(altura*altura);
let clasificacion="", gato="🐱", consejos=[];

if(imc<18.5){
clasificacion="Bajo peso";
gato="🥺🐱";
consejos=[
"🍳 Consume más proteínas.",
"🥑 Incluye grasas saludables.",
"🏋️ Realiza ejercicios de fuerza."
];
}
else if(imc<25){
clasificacion="Peso normal";
gato="😺";
consejos=[
"💧 Mantente hidratado.",
"🥗 Sigue una alimentación equilibrada.",
"🚶 Realiza actividad física regularmente."
];
}
else if(imc<30){
clasificacion="Sobrepeso";
gato="😿";
consejos=[
"🥤 Reduce bebidas azucaradas.",
"🍎 Consume más frutas y verduras.",
"🚶 Camina al menos 30 minutos diarios."
];
}
else{
clasificacion="Obesidad";
gato="🙀";
consejos=[
"🥗 Controla las porciones.",
"🏃 Incrementa gradualmente la actividad física.",
"👩‍⚕️ Consulta a un profesional de salud."
];
}
let resultado=document.getElementById("resultado");
resultado.style.display="block";
resultado.innerHTML=`
<h2>✨ Tu IMC es ${imc.toFixed(2)}</h2>
<p><strong>${clasificacion}</strong></p>`;
let porcentaje=Math.min((imc/40)*100,100);
document.getElementById("progreso").style.width=porcentaje+"%";
let tips=document.getElementById("tips");
tips.style.display="block";
tips.innerHTML=`
<h3>🌸 Recomendaciones</h3>
<ul>${consejos.map(c=>"<li>"+c+"</li>").join("")}</ul>`;}
</script>
</body>
</html>
